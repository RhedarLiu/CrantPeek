[package]
name = "peek-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
peek-core = { path = "../peek-core" }
peek-network = { path = "../peek-network" }
serde_json.workspace = true
fluent-bundle = "0.16"
