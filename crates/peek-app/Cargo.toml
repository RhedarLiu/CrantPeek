[package]
name = "peek-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
peek-core = { path = "../peek-core" }
peek-network = { path = "../peek-network" }
peek-dict = { path = "../peek-dict" }
peek-runtime = { path = "../peek-runtime" }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde_json.workspace = true
egui-phosphor = "0.14"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7"
global-hotkey = "0.8"
tray-icon = "0.26.1"
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Globalization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23.2"
core-foundation = "0.9.4"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
