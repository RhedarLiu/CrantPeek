name: Sync download source
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing formal release tag (for example v0.1.0)'
        required: true
        type: string
      runner:
        description: 'Upload network environment'
        type: choice
        default: macos-latest
        options: [ubuntu-latest, macos-latest]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      runner:
        type: string
        default: macos-latest
    secrets:
      GITCODE_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: download-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check public storage connection
        run: curl --ipv4 --silent --output /dev/null --write-out 'Storage HTTP %{http_code}\n' --connect-timeout 15 --max-time 20 https://file.gitcode.com/
      - name: Synchronize formal release and verify attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/sync-downloads.py
