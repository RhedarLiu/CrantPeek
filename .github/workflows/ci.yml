name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      # Let both platforms report independently. With fail-fast the macOS job was
      # cancelled while the Windows job failed, which hid macOS's real state.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-targets lints every crate including peek-gpui, which is how a
      # Windows-only import error was caught here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Include GUI geometry tests as well as runtime/network tests.
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash tools/package-macos.sh
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-windows.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Crant-Peek-Windows-test
          path: dist/Crant-Peek-Windows.zip
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Crant Peek.app" dist/Crant-Peek-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Crant-Peek-macOS-test
          path: dist/Crant-Peek-macOS.zip
