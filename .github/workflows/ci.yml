name: Rust
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      # Let both platforms report independently. With fail-fast the macOS job was
      # cancelled while the Windows job failed, which hid macOS's real state.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-targets lints every crate including peek-gpui, which is how a
      # Windows-only import error was caught here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Include GUI geometry tests as well as runtime/network tests.
      - run: cargo test --workspace
      - name: Check download synchronization safeguards
        run: python tools/test-sync-downloads.py
      - name: Check encrypted local upload fallback
        run: python tools/test-local-download-upload.py
      - name: Prepare offline dictionary
        uses: actions/checkout@v4
        with:
          repository: skywind3000/ECDICT
          ref: bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b
          path: local-assets/ecdict
      - run: cargo run --release -p peek-dict --bin build-dict -- local-assets/ecdict/ecdict.csv local-assets/ecdict.pkd
      - name: Build macOS release
        if: runner.os == 'macOS'
        run: cargo build --workspace --release
      - name: Build Windows release with static runtime
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --release -p peek-gpui --target x86_64-pc-windows-msvc
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash tools/package-macos.sh
      - name: Ensure installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler installation failed' }
          }
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-windows.ps1 -SkipBuild -Installer
      - name: Verify Windows installation, upgrade and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'CrantPeek-installer-baseline'
          gh release download v0.1.4 --repo RhedarLiu/CrantPeek --pattern Crant-Peek-Windows-Setup.exe --pattern SHA256SUMS.txt --dir $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the v0.1.4 upgrade baseline' }
          $checksum = Get-Content (Join-Path $baseline 'SHA256SUMS.txt') | Where-Object { $_ -match '^([0-9a-f]{64})\s+Crant-Peek-Windows-Setup\.exe$' }
          if (-not $checksum) { throw 'Missing baseline installer checksum' }
          $expectedHash = ($checksum -split '\s+')[0]
          if ((Get-FileHash (Join-Path $baseline 'Crant-Peek-Windows-Setup.exe') -Algorithm SHA256).Hash -ine $expectedHash) { throw 'Baseline installer checksum mismatch' }
          ./tools/test-windows-installer.ps1 -Installer dist/Crant-Peek-Windows-Setup.exe -PortableArchive dist/Crant-Peek-Windows.zip -PreviousInstaller (Join-Path $baseline 'Crant-Peek-Windows-Setup.exe') -PreviousVersion '0.1.4'
      - name: Save Windows installer validation logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-validation
          path: dist/installer-test-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Crant-Peek-Windows-test
          path: |
            dist/Crant-Peek-Windows.zip
            dist/Crant-Peek-Windows-Setup.exe
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Crant Peek.app" dist/Crant-Peek-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Crant-Peek-macOS-test
          path: dist/Crant-Peek-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Crant-Peek-*-test
          merge-multiple: true
          path: release-files
      - name: Verify version and all release packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, zipfile, plistlib, hashlib
          root = pathlib.Path('release-files')
          version = re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and application version differ'
          names = ['Crant-Peek-macOS.zip', 'Crant-Peek-Windows.zip', 'Crant-Peek-Windows-Setup.exe']
          for name in names:
              assert (root / name).is_file(), 'Missing package: ' + name
          for name in names[:2]:
              with zipfile.ZipFile(root / name) as archive:
                  assert archive.testzip() is None, 'Corrupt package: ' + name
                  files = {n.replace('\\', '/'): n for n in archive.namelist() if not n.startswith('__MACOSX/')}
                  if name == names[0]:
                      info = next(n for n in archive.namelist() if n.endswith('/Contents/Info.plist') and not n.startswith('__MACOSX/'))
                      assert plistlib.loads(archive.read(info))['CFBundleShortVersionString'] == version
                      prefix = info.removesuffix('Info.plist') + 'Resources/'
                  else:
                      prefix = ''
                  for license in pathlib.Path('assets/licenses').glob('*.txt'):
                      packaged = prefix + 'licenses/' + license.name
                      assert packaged in files, 'Missing font notice: ' + packaged
                      # Windows checkout can use CRLF; preserve every character
                      # while accepting the platform's line-ending convention.
                      normalize = lambda data: data.replace(b'\r\n', b'\n')
                      assert normalize(archive.read(files[packaged])) == normalize(license.read_bytes()), 'Changed font notice: ' + packaged
          assert (root / names[2]).read_bytes()[:2] == b'MZ'
          (root / 'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256((root / n).read_bytes()).hexdigest() + '  ' + n for n in names) + '\n')
          PY
      - name: Publish formal release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-files/Crant-Peek-macOS.zip release-files/Crant-Peek-Windows.zip release-files/Crant-Peek-Windows-Setup.exe release-files/SHA256SUMS.txt --verify-tag --latest --title "Crant Peek $RELEASE_TAG" --notes-file tools/release-notes.md

  sync-downloads:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/sync-downloads.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
