name: Rust
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      # Let both platforms report independently. With fail-fast the macOS job was
      # cancelled while the Windows job failed, which hid macOS's real state.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-targets lints every crate including peek-gpui, which is how a
      # Windows-only import error was caught here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Include GUI geometry tests as well as runtime/network tests.
      - run: cargo test --workspace
      - name: Prepare offline dictionary
        uses: actions/checkout@v4
        with:
          repository: skywind3000/ECDICT
          ref: bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b
          path: local-assets/ecdict
      - run: cargo run --release -p peek-dict --bin build-dict -- local-assets/ecdict/ecdict.csv local-assets/ecdict.pkd
      - name: Build macOS release
        if: runner.os == 'macOS'
        run: cargo build --workspace --release
      - name: Build Windows release with static runtime
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --release -p peek-gpui --target x86_64-pc-windows-msvc
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash tools/package-macos.sh
      - name: Ensure installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler installation failed' }
          }
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-windows.ps1 -SkipBuild -Installer
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Crant-Peek-Windows-test
          path: |
            dist/Crant-Peek-Windows.zip
            dist/Crant-Peek-Windows-Setup.exe
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Crant Peek.app" dist/Crant-Peek-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Crant-Peek-macOS-test
          path: dist/Crant-Peek-macOS.zip
