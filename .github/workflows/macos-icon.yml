name: Native macOS icon
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/CrantPeek.icon/**'
      - 'tools/compile-macos-icon.sh'
      - '.github/workflows/macos-icon.yml'
jobs:
  icon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Verify basic Icon Composer input
        shell: bash
        run: |
          mkdir -p /tmp/Probe.icon/Assets /tmp/probe-output
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/Probe.icon')
          (root / 'Assets/Glyph.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><circle cx="512" cy="512" r="256" fill="#18181b"/></svg>')
          (root / 'icon.json').write_text(json.dumps({
              'fill': {'automatic-gradient': 'srgb:0.96078,0.96078,0.97647,1.00000'},
              'groups': [{'layers': [{'image-name': 'Glyph.svg', 'name': 'Glyph'}], 'shadow': {'kind': 'neutral', 'opacity': 0.5}, 'translucency': {'enabled': True, 'value': 0.5}}],
              'supported-platforms': {'circles': ['watchOS'], 'squares': 'shared'},
          }))
          PY
          DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer xcrun actool /tmp/Probe.icon --compile /tmp/probe-output --platform macosx --app-icon Probe --output-partial-info-plist /tmp/probe-info.plist --minimum-deployment-target 26.0 --target-device mac
      - name: Diagnose native layer import
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, xml.etree.ElementTree as ET
          source = pathlib.Path('assets/CrantPeek.icon')
          original = json.loads((source / 'icon.json').read_text())
          svg = ET.parse('assets/tray-query.svg').getroot()
          paths = list(svg[0])
          for case in ['no-color-space', 'automatic-fill', 'minimal-png', 'minimal-svg']:
              root = pathlib.Path('/tmp/icon-cases') / case / 'CrantPeek.icon'
              shutil.copytree(source, root)
              icon = json.loads(json.dumps(original))
              icon.pop('color-space-for-untagged-svg-colors', None)
              if case == 'automatic-fill':
                  for group in icon['groups']:
                      for layer in group['layers']: layer['fill'] = 'automatic'
              if case.startswith('minimal'):
                  groups = []
                  for index, name in enumerate(['Lens', 'Text', 'Sparkle']):
                      image = name + '.png'
                      if case == 'minimal-svg':
                          image = name + '.svg'
                          inner = ''.join(ET.tostring(p, encoding='unicode') for p in (paths[:2] if index == 0 else [paths[index+1]]))
                          content = '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" color="#18181b" fill="none"><g transform="translate(205 205) scale(25.6)" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + inner + '</g></svg>'
                          (root / 'Assets' / image).write_text(content)
                      groups.append({'layers': [{'image-name': image, 'name': name}], 'shadow': {'kind': 'neutral', 'opacity': 0.5}, 'translucency': {'enabled': True, 'value': 0.5}})
                  icon = {'fill': original['fill'], 'groups': groups, 'supported-platforms': original['supported-platforms']}
              (root / 'icon.json').write_text(json.dumps(icon, indent=2))
          PY
          for case in no-color-space automatic-fill minimal-png minimal-svg; do
            mkdir -p "/tmp/icon-cases/$case/output"
            if DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer xcrun actool "/tmp/icon-cases/$case/CrantPeek.icon" --compile "/tmp/icon-cases/$case/output" --platform macosx --app-icon CrantPeek --output-partial-info-plist "/tmp/icon-cases/$case/output/icon-info.plist" --minimum-deployment-target 26.0 --target-device mac > "/tmp/icon-cases/$case/compiler.log" 2>&1; then
              echo "$case: passed"
            else
              echo "$case: failed"
              head -5 "/tmp/icon-cases/$case/compiler.log"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Crant-Peek-native-icon-diagnostics
          path: /tmp/icon-cases/
      - run: bash tools/compile-macos-icon.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Crant-Peek-native-macOS-icon
          path: dist/macos-icon/
