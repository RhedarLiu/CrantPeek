[workspace]
members = ["crates/peek-core", "crates/peek-network", "crates/peek-dict", "crates/peek-app"]
# UI framework spikes are throwaway, standalone workspaces. Excluded so a
# `cargo init`/`cargo new` inside spikes/ can never be adopted as a member
# (that previously produced "multiple workspace roots" and broke the build).
exclude = ["spikes"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
