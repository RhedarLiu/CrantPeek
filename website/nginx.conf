# Copy public/ to /var/www/crantpeek/public before enabling this server.
# This HTTP server can sit behind a TLS reverse proxy. For direct HTTPS,
# use Certbot with the nginx plugin as described in 部署说明.md.
server {
    listen 80;
    listen [::]:80;
    server_name crantpeek.eno.ink;
    root /var/www/crantpeek/public;
    index index.html;

    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        expires -1;
    }

    # nginx serves byte ranges itself, allowing video seeking.
    location ~* \.(mp4|ttf|jpg|svg|css|js)$ {
        try_files $uri =404;
        expires 1h;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
}
